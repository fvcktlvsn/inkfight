function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}function pose(frames,t){let i=0;while(i<frames.length-2&&t>frames[i+1][0])i++;let a=frames[i],b=frames[i+1],u=ease((t-a[0])/(b[0]-a[0]));return a.map((v,j)=>v+(b[j]-v)*u)}
function ln(a,b,w){g.lineWidth=w;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}

function explosion(x,y){for(let i=0;i<45;i++){let a=Math.random()*Math.PI*2,s=3+Math.random()*11;bursts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*18})}}
function draw(t){g.fillStyle='#f6f6f3';g.fillRect(0,0,960,540);g.strokeStyle='#171717';ln([0,430],[960,430],3);g.fillStyle='#171717';g.font='bold 13px system-ui';g.fillText('ORIGINAL MOTION STUDY / TAKE 06',20,30);const a=pose(framesA,t),b=pose(framesB,t);for(const f of [a,b]){g.fillStyle='#ddd';g.beginPath();g.ellipse(f[1],435,44,7,0,0,Math.PI*2);g.fill()}drawF(a,1,false);drawF(b,-1,true);if(t>580&&t<850||t>1650&&t<1950||t>2550&&t<2880){const x=t<850?610:t<1950?610:720,y=t<850?300:t<1950?315:285,r=20+((t%320)/320)*80;g.strokeStyle='#171717';for(let i=0;i<12;i++){let angle=i*Math.PI/6;ln([x+Math.cos(angle)*r*.4,y+Math.sin(angle)*r*.4],[x+Math.cos(angle)*r,y+Math.sin(angle)*r],2)}}for(const p of bursts){g.fillStyle='#171717';g.beginPath();g.arc(p.x,p.y,Math.max(.8,p.life/12),0,Math.PI*2);g.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.life--}bursts=bursts.filter(p=>p.life>0)}
const impacts=[[680,610,300],[1770,610,315],[2700,720,285]];function tick(ts){if(playing){time=Math.min(duration,ts-started);for(let i=0;i<impacts.length;i++)if(time>=impacts[i][0]&&lastImpact<i){explosion(impacts[i][1],impacts[i][2]);lastImpact=i}if(time>=duration){playing=false;button.textContent='↻ REPLAY EXCHANGE'}}draw(time);requestAnimationFrame(tick)}
