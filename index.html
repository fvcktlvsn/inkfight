<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INK//FIGHT 03</title><style>*{box-sizing:border-box}body{margin:0;background:#e7e6e1;color:#111;font:700 13px system-ui}main{max-width:1000px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}h1{font-size:29px;letter-spacing:-2px;margin:0}canvas{display:block;width:100%;background:#f1f0ec}#hud{display:flex;gap:8px;align-items:center;padding:6px 12px}.bar{flex:1;height:9px;background:#c5c3be}.bar div{height:100%;background:#111}.right div{margin-left:auto}#status{border-block:2px solid #111;padding:8px 12px;font-size:11px;letter-spacing:1px}.tools{display:flex;flex-wrap:wrap;gap:7px;padding:9px 12px}button,select{background:#faf9f6;border:2px solid #111;border-radius:5px;padding:10px;font:800 12px system-ui;color:#111;touch-action:manipulation}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:3px 12px}.controls button{min-height:50px}.controls .primary{background:#111;color:#fff}footer{font-size:11px;font-weight:400;padding:10px 12px;color:#555}@media(orientation:landscape) and (max-height:550px){header{padding:2px 12px}h1{font-size:18px}canvas{height:49vh}#hud{padding:2px 12px}.tools{padding:3px 12px}.controls{grid-template-columns:repeat(6,1fr)}.controls button{min-height:32px;padding:4px}footer{display:none}}</style></head><body><main><header><h1>INK//FIGHT</h1><span>MOTION LAB / 03</span></header><div id="hud"><span id="an">WISP</span><div class="bar"><div id="ah"></div></div>VS<div class="bar right"><div id="bh"></div></div><span id="bn">SHADE</span></div><canvas id="stage" width="960" height="430"></canvas><div id="status">ENGINE STARTING</div><div class="tools"><select id="player"><option value="wisp">WISP / heroine</option><option value="shade">SHADE / fighter</option><option value="brute">BRUTE / mutant</option></select><select id="rival"><option value="shade">SHADE / rival</option><option value="brute">BRUTE / rival</option><option value="wisp">WISP / rival</option></select><button id="mode">LIVE MODE</button><button id="slow">SLOW ×0.25</button><button id="reset">RESET</button></div><div class="controls" id="controls"></div><footer>Tap actions to watch. EXCHANGE previews choreographed combat. LIVE MODE: arrows, J punch, K kick, L heavy, U block, I spin, O exchange. Bluetooth controllers where supported.</footer></main><script>
(()=>{const $=id=>document.getElementById(id),g=$('stage').getContext('2d'),G=353,types={wisp:[.78,6.5,7],shade:[1,4.5,10],brute:[1.42,2.7,16]};let a,b,time=0,events=[],sparks=[],shake=0,slow=false,live=false,keys={},padPrev={};const pose={idle:[0,0,-28,27,-26,26,-25,26],guard:[-9,14,-15,-47,-38,-49,-27,22],wind:[-28,15,-58,10,-24,-36,-35,32],punch:[27,9,-40,20,119,-33,-32,43],heavy:[34,16,-56,20,143,-20,-40,57],kickwind:[-24,12,-46,-30,37,-38,-37,32],kick:[-27,11,-49,-42,41,-35,-38,139],crouch:[-17,51,-38,-35,38,-41,-62,63],jump:[0,-12,-43,-64,45,-64,-53,55],spin:[12,5,-55,-38,61,-34,-48,147],hit:[-43,10,-68,-48,33,11,-30,31],fall:[-65,60,-60,7,43,-40,-58,52],dash:[30,23,-70,14,59,-15,-75,67]};const clips={punch:[[0,'guard'],[.24,'wind'],[.43,'punch'],[.62,'punch'],[1,'guard']],kick:[[0,'guard'],[.23,'kickwind'],[.46,'kick'],[.64,'kick'],[1,'guard']],heavy:[[0,'guard'],[.3,'wind'],[.53,'heavy'],[.7,'heavy'],[1,'guard']],spin:[[0,'guard'],[.25,'kickwind'],[.5,'spin'],[.72,'spin'],[1,'guard']],block:[[0,'idle'],[.15,'guard'],[.85,'guard'],[1,'idle']],duck:[[0,'idle'],[.2,'crouch'],[.8,'crouch'],[1,'idle']],jump:[[0,'guard'],[.22,'jump'],[.8,'jump'],[1,'idle']],dash:[[0,'guard'],[.25,'dash'],[.8,'dash'],[1,'guard']],hit:[[0,'guard'],[.15,'hit'],[.7,'hit'],[1,'guard']],fall:[[0,'hit'],[.5,'fall'],[.83,'fall'],[1,'guard']]};const durations={punch:430,kick:560,heavy:680,spin:730,block:520,duck:500,jump:760,dash:400,hit:410,fall:900};const make=(type,x,dir)=>({type,x,dir,hp:100,action:'idle',start:0,end:0,y:0,vy:0,done:false});function reset(){a=make($('player').value,250,1);b=make($('rival').value,700,-1);events=[];sparks=[];hud();$('status').textContent='READY / TAP AN ACTION'}function hud(){$('an').textContent=a.type.toUpperCase();$('bn').textContent=b.type.toUpperCase();$('ah').style.width=a.hp+'%';$('bh').style.width=b.hp+'%'}function play(f,act,force=false){if(!force&&time<f.end)return false;f.action=act;f.start=time;f.end=time+(durations[act]||420);f.done=false;if(act==='jump')f.vy=-1.05;return true}const smooth=t=>t*t*(3-2*t);function shape(f){if(time>=f.end)return pose.idle;const frames=clips[f.action]||clips.hit,t=Math.max(0,Math.min(1,(time-f.start)/(f.end-f.start)));for(let i=1;i<frames.length;i++)if(t<=frames[i][0]){const q=smooth((t-frames[i-1][0])/(frames[i][0]-frames[i-1][0]));return pose[frames[i-1][1]].map((v,j)=>v+(pose[frames[i][1]][j]-v)*q)}return pose.idle}function ink(x,y,n=24){for(let i=0;i<n;i++){const theta=Math.random()*Math.PI*2,spd=3+Math.random()*12;sparks.push({x,y,vx:Math.cos(theta)*spd,vy:Math.sin(theta)*spd-3,t:450+Math.random()*250,r:1+Math.random()*3})}}function hit(f,o){const reach=f.action==='spin'?200:f.action==='kick'?170:150;if(Math.abs(f.x-o.x)>reach)return;let dmg=Math.round(types[f.type][2]*(f.action==='heavy'?1.7:f.action==='spin'?1.4:1)*(o.action==='block'?.25:1));o.hp=Math.max(0,o.hp-dmg);o.x=Math.min(900,Math.max(60,o.x+f.dir*dmg*2.3));play(o,f.action==='heavy'||f.action==='spin'?'fall':'hit',true);ink(o.x,G-95*types[o.type][0],f.action==='heavy'?42:26);shake=f.action==='heavy'?12:6;hud();if(o.hp===0)$('status').textContent='K.O. / '+(f===a?'PLAYER':'RIVAL')+' WINS'}function line(points,width){g.lineWidth=width;g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.stroke()}function drawF(f){let p=shape(f),s=types[f.type][0],x=f.x,y=G+f.y;g.save();g.translate(x,y);g.scale(f.dir*s,s);g.lineCap='round';g.lineJoin='round';g.strokeStyle='#151515';g.fillStyle='#f1f0ec';const neck=[p[0],-132+p[1]],hip=[0,-69+p[1]],head=[p[0],-158+p[1]],lh=[p[0]+p[2],-89+p[3]+p[1]],rh=[p[0]+p[4],-89+p[5]+p[1]],lf=[-31+p[6]*.3,4],rf=[31+p[7]*.75,4-(p[7]>100?65:0)];if(f.type==='wisp'){g.beginPath();g.moveTo(-8,-127+p[1]);g.quadraticCurveTo(-50,-148,-91-Math.sin(time*.006)*18,-92);g.lineTo(-14,-92);g.closePath();g.fillStyle='#c3c2bd';g.fill();g.stroke();g.fillStyle='#f1f0ec'}line([hip,neck],f.type==='brute'?16:7);line([neck,[lh[0]*.5,lh[1]-22],lh],f.type==='brute'?13:6);line([neck,[rh[0]*.56,rh[1]-19],rh],f.type==='brute'?13:6);line([hip,[-24,-29+p[1]],lf],f.type==='brute'?17:7);line([hip,[p[7]*.35,-30+p[1]],rf],f.type==='brute'?18:7);g.beginPath();g.arc(...head,f.type==='brute'?29:f.type==='wisp'?17:21,0,Math.PI*2);g.lineWidth=f.type==='brute'?6:5;g.fill();g.stroke();if(f.type==='wisp'){g.beginPath();g.moveTo(-15,-162+p[1]);g.quadraticCurveTo(-23,-196+p[1],3,-188+p[1]);g.quadraticCurveTo(30,-192+p[1],19,-157+p[1]);g.stroke();g.beginPath();g.moveTo(-17,-67+p[1]);g.lineTo(17,-67+p[1]);g.lineTo(24,-43+p[1]);g.lineTo(-23,-43+p[1]);g.closePath();g.stroke()}if(f.type==='brute'){g.beginPath();g.moveTo(-24,-139+p[1]);g.quadraticCurveTo(-66,-163+p[1],-57,-102+p[1]);g.moveTo(25,-140+p[1]);g.quadraticCurveTo(60,-158+p[1],52,-108+p[1]);g.stroke();line([[-13,-162+p[1]],[-3,-154+p[1]]],4);line([[13,-162+p[1]],[4,-154+p[1]]],4)}g.restore()}
function exchange(){events=[];a.x=310;b.x=520;const seq=[[0,()=>play(a,'dash',true)],[300,()=>play(a,'punch',true)],[700,()=>play(b,'kick',true)],[1050,()=>play(a,'hit',true)],[1350,()=>play(a,'spin',true)],[1730,()=>hit(a,b)],[2200,()=>play(b,'fall',true)]];for(const [dt,fn]of seq)events.push({at:time+dt,fn});$('status').textContent='CHOREOGRAPHED EXCHANGE'}function step(f,other,dt){if(time<f.end){let t=(time-f.start)/(f.end-f.start);if(!f.done&&t>.48&&['punch','kick','heavy','spin'].includes(f.action)){hit(f,other);f.done=true}if(f.action==='dash')f.x+=f.dir*dt*.35}if(f.vy||f.y<0){f.y+=f.vy*dt;f.vy+=.003*dt;if(f.y>0){f.y=0;f.vy=0}}}function draw(){g.save();g.clearRect(0,0,960,430);g.fillStyle='#f1f0ec';g.fillRect(0,0,960,430);g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake*.5);g.strokeStyle='#181818';line([[0,G],[960,G]],3);g.font='800 13px system-ui';g.fillStyle='#151515';g.fillText('ROUND 01  /  THE PAPER ARENA',22,30);g.textAlign='right';g.fillText('MOTION STUDY 03',936,30);g.textAlign='left';drawF(a);drawF(b);for(const p of sparks){g.fillStyle='#111';g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill()}g.restore()}
let last=0;function loop(ts){let dt=Math.min(35,ts-last||16);last=ts;dt*=slow?.25:1;time+=dt;for(const e of events.filter(e=>e.at<=time))e.fn();events=events.filter(e=>e.at>time);step(a,b,dt);step(b,a,dt);if(live){if(keys.ArrowLeft)a.x-=types[a.type][1]*dt/16;if(keys.ArrowRight)a.x+=types[a.type][1]*dt/16;const pad=Array.from(navigator.getGamepads?.()||[]).find(Boolean);if(pad){let axis=pad.axes[0]||0;if(Math.abs(axis)>.2)a.x+=axis*types[a.type][1]*dt/16;const map={0:'punch',1:'kick',2:'heavy',3:'spin',4:'block',5:'jump',12:'jump'};for(const [i,m]of Object.entries(map)){const down=!!pad.buttons[i]?.pressed;if(down&&!padPrev[i])play(a,m);padPrev[i]=down}}}a.x=Math.max(50,Math.min(910,a.x));b.x=Math.max(50,Math.min(910,b.x));for(const p of sparks){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=.35*dt/16;p.t-=dt}sparks=sparks.filter(p=>p.t>0);shake*=.82;draw();requestAnimationFrame(loop)}const buttons=['Back','Forward','Jump','Duck','Punch','Kick','Heavy','Block','Dash','Spin Kick','Exchange','Rival Attack'];$('controls').innerHTML=buttons.map(x=>'<button class="'+(x==='Exchange'?'primary':'')+'" data-m="'+x+'">'+x+'</button>').join('');$('controls').onclick=e=>{const el=e.target.closest('button');if(!el)return;const v=el.dataset.m.toLowerCase();if(v==='exchange'){exchange();return}if(v==='rival attack'){play(b,'heavy');return}if(v==='back'||v==='forward'){a.x+=a.dir*(v==='forward'?46:-46);play(a,'dash');return}play(a,v==='spin kick'?'spin':v)};$('player').onchange=reset;$('rival').onchange=reset;$('reset').onclick=reset;$('mode').onclick=()=>{live=!live;$('mode').textContent=live?'STEP MODE':'LIVE MODE'};$('slow').onclick=()=>{slow=!slow;$('slow').textContent=slow?'NORMAL SPEED':'SLOW ×0.25'};addEventListener('keydown',e=>{keys[e.key]=true;if(!live)return;const m={ArrowUp:'jump',ArrowDown:'duck',j:'punch',k:'kick',l:'heavy',u:'block',i:'spin',o:'exchange'};if(m[e.key]){m[e.key]==='exchange'?exchange():play(a,m[e.key]);e.preventDefault()}});addEventListener('keyup',e=>keys[e.key]=false);reset();requestAnimationFrame(loop)})();
</script></body></html>
