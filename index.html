<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INK//FIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#eae8e0;color:#111;font:700 14px system-ui}main{max-width:950px;margin:auto}header{padding:12px 15px;display:flex;justify-content:space-between;border-bottom:3px solid #111}h1{margin:0;font-size:24px;letter-spacing:-1px}canvas{width:100%;display:block;background:#faf9f5}#hud{display:flex;gap:10px;padding:12px;align-items:center}.bar{flex:1;height:12px;border:2px solid #111;background:white}.fill{height:100%;background:#111}.settings,.controls{display:flex;gap:7px;padding:8px 12px;flex-wrap:wrap}button,select{border:2px solid #111;border-radius:7px;background:#fff;color:#111;padding:10px;font:inherit;touch-action:manipulation}button:active{background:#111;color:#fff}.controls{display:grid;grid-template-columns:repeat(4,1fr)}.controls button{min-height:52px;padding:6px;font-size:12px}#status{padding:8px 12px;font-size:12px}footer{padding:10px 12px;font-size:11px;font-weight:400}@media(orientation:landscape) and (max-height:540px){header{padding:3px 12px}h1{font-size:17px}canvas{height:47vh}#hud{padding:3px}.settings,.controls{padding:3px 10px}.controls{grid-template-columns:repeat(6,1fr)}.controls button{min-height:32px}footer{display:none}}</style></head><body><main><header><h1>INK//FIGHT <small>LAB 02</small></h1><span id="mode">STEP MODE</span></header><div id="hud"><b id="pn">WISP</b><div class="bar"><div class="fill" id="ph"></div></div>VS<div class="bar"><div class="fill" id="eh"></div></div><b id="en">MUTANT</b></div><canvas id="arena" width="900" height="420"></canvas><div id="status">Starting engine…</div><div class="settings"><select id="player"><option value="wisp">WISP — fast</option><option value="slash">SLASH — balanced</option><option value="mutant">MUTANT — powerful</option></select><select id="enemy"><option value="mutant">MUTANT</option><option value="slash">SLASH</option><option value="wisp">WISP</option></select><button id="live">LIVE MODE</button><button id="reset">RESET</button><button id="slow">SLOW: OFF</button></div><div class="controls" id="controls"></div><footer>Tap any move to preview. Live mode: arrows to move, J punch, K kick, L heavy, U block, I blast, O combo. Bluetooth controller supported when available through Safari's Gamepad API.</footer></main><script>
(()=>{const $=id=>document.getElementById(id),c=$('arena'),g=c.getContext('2d');if(!g){$('status').textContent='Canvas unavailable';return}const types={wisp:[115,6,7],slash:[155,4,11],mutant:[215,2.5,17]};let p,e,live=false,slow=false,particles=[],frame=0,last=0,keys={},padPrev={};const ground=350;
function make(type,x,dir){return {type,x,dir,hp:100,y:0,vy:0,action:'idle',t:0,hit:false}}
function reset(){p=make($('player').value,230,1);e=make($('enemy').value,670,-1);particles=[];hud()}
function hud(){$('pn').textContent=p.type.toUpperCase();$('en').textContent=e.type.toUpperCase();$('ph').style.width=p.hp+'%';$('eh').style.width=e.hp+'%'}
function action(f,a){if(f.t>0)return;f.action=a;f.t=a==='combo'?62:a==='blast'?46:a==='heavy'?38:30;f.hit=false;if(a==='jump')f.vy=-13;if(a==='forward')f.x+=f.dir*35;if(a==='back')f.x-=f.dir*35;if(a==='dash')f.x+=f.dir*85;f.x=Math.max(40,Math.min(860,f.x));$('status').textContent=(f===p?'PLAYER':'RIVAL')+' — '+a.toUpperCase()}
function burst(x,y){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*15,vy:(Math.random()-.8)*12,t:25+Math.random()*20})}
function strike(f,other){let reach=f.action==='blast'?430:f.action==='kick'?155:135;if(Math.abs(f.x-other.x)<reach){const damage=Math.round(types[f.type][2]*(f.action==='combo'?2:f.action==='heavy'?1.6:1)*(other.action==='block'?.2:1));other.hp=Math.max(0,other.hp-damage);other.x+=f.dir*damage;burst(other.x,ground-types[other.type][0]*.65);hud();if(other.hp===0)$('status').textContent=f===p?'KNOCKOUT — YOU WIN':'KNOCKOUT — RIVAL WINS'}}
function update(f,other){if(f.t>0){f.t--;if(['punch','kick','heavy','blast','combo'].includes(f.action)&&!f.hit&&f.t<(f.action==='combo'?36:18)){strike(f,other);f.hit=true}if(f.t===0)f.action='idle'}if(f.vy||f.y<0){f.y+=f.vy;f.vy+=.75;if(f.y>0){f.y=0;f.vy=0}}}
function line(a,b,w=5){g.lineWidth=w;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
function drawF(f){const h=types[f.type][0],s=h/150,x=f.x,y=ground+f.y,active=f.t>0,attack=active&&['punch','kick','heavy','blast','combo'].includes(f.action),kick=f.action==='kick'&&active,crouch=f.action==='duck'&&active?25:0,lean=f.action==='dash'&&active?16:0;g.save();g.translate(x,y);g.scale(f.dir,1);g.strokeStyle='#111';g.fillStyle='#faf9f5';g.lineCap='round';g.lineJoin='round';const hip=[0,-h*.43+crouch],neck=[lean,-h*.79+crouch],head=[lean,-h*.92+crouch];line(hip,neck,f.type==='mutant'?14:5);g.lineWidth=5;g.beginPath();g.arc(...head,f.type==='mutant'?27:f.type==='wisp'?15:19,0,Math.PI*2);g.fill();g.stroke();if(f.type==='wisp'){g.beginPath();g.moveTo(-13,-h*.94);g.quadraticCurveTo(-22,-h*1.14,2,-h*1.08);g.quadraticCurveTo(22,-h*1.1,16,-h*.94);g.stroke();g.beginPath();g.moveTo(-8,-h*.77);g.quadraticCurveTo(-42,-h*.85,-67+Math.sin(frame*.08)*14,-h*.51);g.lineTo(-12,-h*.54);g.stroke();line([-14,hip[1]],[14,hip[1]],2);line([-14,hip[1]],[0,hip[1]+21],2);line([14,hip[1]],[0,hip[1]+21],2)}if(f.type==='mutant'){g.beginPath();g.moveTo(-25,-h*.77);g.quadraticCurveTo(-65,-h*.83,-54,-h*.49);g.stroke();line([-9,-h*.94],[0,-h*.9],3);line([12,-h*.94],[5,-h*.9],3)}line(neck,attack?[110*s,neck[1]+15]:[35*s,neck[1]+40+Math.sin(frame*.08)*3],f.type==='mutant'?11:5);line(neck,[-32*s,neck[1]+37],f.type==='mutant'?10:5);line(hip,kick?[105*s,hip[1]-40]:[30*s,0],f.type==='mutant'?12:5);line(hip,[-31*s,0],f.type==='mutant'?12:5);if(f.action==='blast'&&active){g.beginPath();g.arc(140*s,neck[1],20+Math.sin(frame*.2)*6,0,Math.PI*2);g.stroke()}g.restore()}
function draw(){g.fillStyle='#faf9f5';g.fillRect(0,0,900,420);g.fillStyle='#111';g.font='bold 15px system-ui';g.fillText('ROUND 01 / PAPER ARENA',24,32);g.textAlign='right';g.fillText('INK//FIGHT',875,32);g.textAlign='left';g.strokeStyle='#111';line([0,ground],[900,ground],4);drawF(p);drawF(e);for(const a of particles){g.fillStyle='#111';g.beginPath();g.arc(a.x,a.y,Math.max(1,a.t/12),0,Math.PI*2);g.fill();a.x+=a.vx;a.y+=a.vy;a.vy+=.4;a.t--}particles=particles.filter(a=>a.t>0)}
let accumulator=0;function loop(ts){accumulator+=Math.min(50,ts-last||16)*(slow?.3:1);last=ts;while(accumulator>=16.67){frame++;update(p,e);update(e,p);if(live){if(keys.ArrowLeft)p.x-=types[p.type][1];if(keys.ArrowRight)p.x+=types[p.type][1];const pad=Array.from(navigator.getGamepads?.()||[]).find(Boolean);if(pad){const axis=pad.axes[0]||0;if(Math.abs(axis)>.2)p.x+=axis*types[p.type][1];const mapping={0:'punch',1:'kick',2:'heavy',3:'blast',4:'block',5:'combo',12:'jump',14:'back',15:'forward'};for(const [i,a]of Object.entries(mapping)){let on=!!pad.buttons[i]?.pressed;if(on&&!padPrev[i])action(p,a);padPrev[i]=on}}p.x=Math.max(40,Math.min(860,p.x))}accumulator-=16.67}draw();requestAnimationFrame(loop)}
const names=['Back','Forward','Jump','Duck','Punch','Kick','Heavy','Block','Dash','Ink Blast','Combo','Rival Attack'];$('controls').innerHTML=names.map(a=>'<button data-action="'+a+'">'+a+'</button>').join('');$('controls').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;let a=b.dataset.action.toLowerCase().replaceAll(' ','');action(a==='rivalattack'?e:p,a==='inkblast'?'blast':a==='rivalattack'?'heavy':a)};$('player').onchange=reset;$('enemy').onchange=reset;$('reset').onclick=reset;$('live').onclick=()=>{live=!live;$('live').textContent=live?'STEP MODE':'LIVE MODE';$('mode').textContent=live?'LIVE MODE':'STEP MODE'};$('slow').onclick=()=>{slow=!slow;$('slow').textContent='SLOW: '+(slow?'ON':'OFF')};addEventListener('keydown',ev=>{keys[ev.key]=true;if(!live)return;const m={ArrowUp:'jump',ArrowDown:'duck',j:'punch',k:'kick',l:'heavy',u:'block',i:'blast',o:'combo'};if(m[ev.key]){action(p,m[ev.key]);ev.preventDefault()}});addEventListener('keyup',ev=>keys[ev.key]=false);reset();$('status').textContent='ENGINE ACTIVE — tap PUNCH to test';requestAnimationFrame(loop)})();
</script></body></html>
