<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INK//FIGHT — Scene 01</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e7e2;color:#151515;font:700 14px system-ui}main{max-width:1100px;margin:auto}header{padding:18px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:26px;letter-spacing:-1px}small{font-size:11px;letter-spacing:2px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#f6f5f1}section{padding:24px;display:grid;gap:12px;justify-items:center}button{width:min(100%,420px);border:0;border-radius:12px;background:#151515;color:white;font:800 18px system-ui;padding:22px;touch-action:manipulation}#status{font-size:12px;letter-spacing:1px}p{font-weight:400;font-size:12px;text-align:center;margin:0}@media(orientation:landscape) and (max-height:500px){header{padding:5px 12px}h1{font-size:19px}canvas{height:66vh;aspect-ratio:auto}section{padding:5px}button{padding:9px}p{display:none}}</style></head><body><main><header><h1>INK//FIGHT</h1><small>SCENE 01 · MOTION TEST</small></header><canvas id="stage" width="960" height="540"></canvas><section><button id="play">▶ PLAY FIGHT SEQUENCE</button><div id="status">READY · 8 SECOND CHOREOGRAPHY</div><p>One button, one exchange. Record your screen to critique the motion.</p></section></main><script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d'),btn=document.querySelector('button'),status=document.querySelector('#status');if(!g){status.textContent='Canvas unavailable';return}let start=0,elapsed=0,running=false,last=-1,particles=[],shake=0;const duration=8000;const E=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)},lerp=(a,b,t)=>a+(b-a)*t;
const P=(x,y,rot,arms,legs,tilt=0)=>({x,y,rot,arms,legs,tilt});
const A=[[0,P(225,0,0,[-.7,.9],[-.25,.3])],[550,P(220,8,-.25,[-1.1,.4],[-.8,.8],-.3)],[920,P(375,-4,.2,[-1.4,1.8],[-.6,.7],.2)],[1120,P(390,-4,.3,[-1.4,1.8],[-.6,.7],.25)],[1420,P(345,9,-.4,[-1,.7],[-.8,.9],-.3)],[1710,P(380,-45,.4,[-1.8,1.4],[-1.2,1.3])],[1990,P(405,-75,.55,[-1.8,1.4],[-1.3,1.4])],[2230,P(410,0,-.1,[-.9,.9],[-.4,.5])],[2520,P(370,12,-.6,[-1.5,1.5],[-.9,.9],-.5)],[2870,P(415,-5,.4,[-1.5,1.9],[-.5,.7],.3)],[3100,P(420,-5,.4,[-1.5,1.9],[-.5,.7],.3)],[3480,P(340,12,-.5,[-1.3,.6],[-1,.8],-.4)],[3850,P(335,-12,-.8,[-1.6,1.3],[-1.4,1.2],-.5)],[4200,P(390,-120,-2.2,[-1.6,1.6],[-1.3,1.3])],[4580,P(465,-90,-4.5,[-1.6,1.6],[-1.3,1.3])],[4940,P(520,0,-6.28,[-1,.8],[-.3,.3])],[5450,P(490,8,-6.5,[-1.4,.8],[-.8,.7],-.4)],[5860,P(590,-3,-6.1,[-1.6,1.9],[-.5,.6],.3)],[6080,P(590,-3,-6.1,[-1.6,1.9],[-.5,.6],.3)],[6600,P(495,0,-6.28,[-.7,.9],[-.25,.3])],[8000,P(495,0,-6.28,[-.7,.9],[-.25,.3])]];
const B=[[0,P(725,0,0,[-.8,.8],[-.3,.3])],[650,P(725,0,0,[-.8,.8],[-.3,.3])],[1050,P(635,-4,-.35,[-1.5,1.3],[-.8,.8],-.2)],[1210,P(625,-4,-.35,[-1.5,1.3],[-.8,.8],-.2)],[1520,P(670,0,.5,[-1.8,.7],[-.8,.8],.3)],[1950,P(665,0,.15,[-.8,.9],[-.3,.3])],[2200,P(615,0,-.3,[-1.5,.7],[-.9,.8],-.2)],[2600,P(550,0,.25,[-1.5,1.9],[-.5,.6],.2)],[2870,P(540,0,.35,[-1.5,1.9],[-.5,.6],.3)],[3150,P(570,0,-.15,[-.9,.8],[-.4,.4])],[3500,P(570,0,-.15,[-.9,.8],[-.4,.4])],[3850,P(530,0,-.4,[-1.5,1.3],[-.8,.8],-.3)],[4200,P(515,0,.15,[-1.4,1.8],[-.5,.6])],[5200,P(515,0,.15,[-.8,.8],[-.3,.3])],[5600,P(545,0,-.3,[-1.5,1.2],[-.8,.8],-.3)],[5860,P(600,0,.35,[-1.5,1.9],[-.5,.6],.3)],[6090,P(630,0,.9,[-1.6,1.6],[-1,1])],[6550,P(760,-65,2,[-1.6,1.6],[-1,1])],[6940,P(840,-95,3.8,[-1.6,1.6],[-1,1])],[7260,P(845,0,4.7,[-1.6,1.6],[-1,1])],[8000,P(845,0,4.7,[-1.6,1.6],[-1,1])]];
function sample(track,t){let i=0;while(i<track.length-2&&t>track[i+1][0])i++;const [ta,a]=track[i],[tb,b]=track[i+1],u=E((t-ta)/(tb-ta));return {x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u),rot:lerp(a.rot,b.rot,u),tilt:lerp(a.tilt,b.tilt,u),arms:a.arms.map((v,j)=>lerp(v,b.arms[j],u)),legs:a.legs.map((v,j)=>lerp(v,b.legs[j],u))}}
function line(x,y,X,Y,w){g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}function limb(x,y,angle,len){return [x+Math.sin(angle)*len,y+Math.cos(angle)*len]}
function fighter(q,face,big){g.save();g.translate(q.x,426+q.y);g.rotate(q.rot);g.scale(face*(big?1.14:1),big?1.14:1);g.strokeStyle='#171717';g.fillStyle='#f6f5f1';g.lineCap='round';g.lineJoin='round';const hx=q.tilt*18,hip=[0,-57],chest=[hx,-116],head=[hx*1.4,-162];line(...hip,...chest,big?16:10);g.lineWidth=big?8:6;g.beginPath();g.arc(...head,big?22:19,0,Math.PI*2);g.fill();g.stroke();for(let i=0;i<2;i++){const side=i===0?-1:1,shoulder=[chest[0]+side*13,chest[1]],elbow=limb(...shoulder,q.arms[i],43),hand=limb(...elbow,q.arms[i]+side*.5,40);line(...shoulder,...elbow,big?13:8);line(...elbow,...hand,big?12:7);const root=[hip[0]+side*8,hip[1]],knee=limb(...root,q.legs[i],50),foot=limb(...knee,q.legs[i]*.4,53);line(...root,...knee,big?15:10);line(...knee,...foot,big?13:9)}g.restore()}
const impacts=[{t:1100,x:490,y:265},{t:2900,x:500,y:285},{t:6040,x:620,y:260}];function burst(h){shake=16;for(let i=0;i<30;i++){const a=Math.random()*6.283,v=3+Math.random()*12;particles.push({x:h.x,y:h.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:15+Math.random()*25})}}
function draw(t){g.setTransform(1,0,0,1,0,0);g.fillStyle='#f6f5f1';g.fillRect(0,0,960,540);g.save();g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.78;g.strokeStyle='#171717';line(0,426,960,426,3);g.fillStyle='#171717';g.font='bold 14px system-ui';g.fillText('PAPER ARENA / TAKE 01',24,34);g.textAlign='right';g.fillText((t/1000).toFixed(1)+'s',930,34);g.textAlign='left';const a=sample(A,t),b=sample(B,t);for(const q of [a,b]){g.fillStyle='#ddd';g.beginPath();g.ellipse(q.x,431,46,7,0,0,Math.PI*2);g.fill()}fighter(a,1,false);fighter(b,-1,true);for(const p of particles){g.fillStyle='#171717';g.beginPath();g.arc(p.x,p.y,Math.max(.8,p.life/10),0,Math.PI*2);g.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.life--}particles=particles.filter(p=>p.life>0);g.restore()}
function tick(ts){if(running){elapsed=Math.min(duration,ts-start);for(let i=0;i<impacts.length;i++)if(elapsed>=impacts[i].t&&last<i){burst(impacts[i]);last=i}if(elapsed>=duration){running=false;btn.textContent='↻ REPLAY FIGHT SEQUENCE';status.textContent='FINISHED · READY TO REPLAY'}}draw(elapsed);requestAnimationFrame(tick)}
btn.onclick=()=>{start=performance.now();elapsed=0;last=-1;shake=0;particles=[];running=true;btn.textContent='↻ RESTART SEQUENCE';status.textContent='PLAYING · CHOREOGRAPHED EXCHANGE'};requestAnimationFrame(tick)})();
</script></body></html>
