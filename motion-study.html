<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INK//FIGHT · Motion Study</title><style>body{margin:0;background:#dededb;color:#111;font:700 14px system-ui;text-align:center}h1{margin:18px 0 8px;font-size:23px}canvas{display:block;width:100%;max-width:1000px;margin:auto;background:#f3f3f0;aspect-ratio:16/9}button{background:#111;color:#fff;border:0;border-radius:12px;padding:20px 42px;margin:18px;font:800 18px system-ui}p{font-size:12px;font-weight:400}</style></head><body><h1>INK//FIGHT · MOTION STUDY 05</h1><canvas id="c" width="960" height="540"></canvas><button id="go">PLAY ROUNDHOUSE</button><p>One hand-posed kick, one knockdown. This is an animation study, not the full game.</p><script>
const c=document.getElementById('c'),g=c.getContext('2d');let t=0,start=0,playing=false,impact=false,ink=[];
const poses=[
{at:0,x:300,y:0,head:[0,-163],neck:[0,-133],hip:[0,-65],lh:[-46,-92],le:[-71,-112],rh:[39,-110],re:[56,-72],lk:[-25,-32],lf:[-45,0],rk:[23,-36],rf:[43,0]},
{at:260,x:286,y:10,head:[-26,-136],neck:[-17,-110],hip:[4,-54],lh:[-38,-84],le:[-65,-55],rh:[8,-92],re:[35,-112],lk:[-28,-26],lf:[-58,0],rk:[29,-36],rf:[55,0]},
{at:470,x:326,y:0,head:[-34,-156],neck:[-25,-128],hip:[10,-67],lh:[-66,-112],le:[-83,-140],rh:[12,-117],re:[-5,-91],lk:[-26,-43],lf:[-38,0],rk:[53,-96],rf:[85,-89]},
{at:590,x:353,y:-7,head:[-45,-154],neck:[-30,-127],hip:[11,-67],lh:[-65,-110],le:[-82,-138],rh:[12,-115],re:[-10,-87],lk:[-28,-40],lf:[-41,6],rk:[99,-91],rf:[157,-106]},
{at:670,x:370,y:-4,head:[-39,-160],neck:[-26,-131],hip:[8,-67],lh:[-67,-117],le:[-81,-146],rh:[11,-119],re:[-9,-92],lk:[-29,-42],lf:[-45,3],rk:[105,-85],rf:[172,-88]},
{at:870,x:376,y:0,head:[-20,-163],neck:[-11,-133],hip:[5,-65],lh:[-52,-111],le:[-70,-95],rh:[25,-113],re:[40,-81],lk:[-26,-35],lf:[-43,0],rk:[50,-48],rf:[69,-3]},
{at:1140,x:366,y:0,head:[0,-163],neck:[0,-133],hip:[0,-65],lh:[-45,-102],le:[-64,-80],rh:[37,-108],re:[58,-82],lk:[-24,-34],lf:[-44,0],rk:[24,-34],rf:[44,0]},
{at:2600,x:366,y:0,head:[0,-163],neck:[0,-133],hip:[0,-65],lh:[-45,-102],le:[-64,-80],rh:[37,-108],re:[58,-82],lk:[-24,-34],lf:[-44,0],rk:[24,-34],rf:[44,0]}];
const victim=[
{at:0,x:620,y:0,a:0},{at:580,x:620,y:0,a:0},{at:680,x:653,y:-12,a:.4},{at:850,x:728,y:-66,a:1.2},{at:1070,x:820,y:-50,a:2.8},{at:1250,x:847,y:0,a:4.3},{at:2600,x:847,y:0,a:4.3}];
const smooth=v=>{v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)};
function interp(arr,ms){let i=0;while(i<arr.length-2&&ms>arr[i+1].at)i++;let a=arr[i],b=arr[i+1],u=smooth((ms-a.at)/(b.at-a.at)),o={};for(let k in a){if(k==='at')continue;o[k]=Array.isArray(a[k])?a[k].map((n,j)=>n+(b[k][j]-n)*u):a[k]+(b[k]-a[k])*u}return o}
function line(a,b,w){g.lineCap='round';g.lineJoin='round';g.lineWidth=w;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
function figure(p){g.save();g.translate(p.x,426+p.y);g.strokeStyle='#171717';g.fillStyle='#f3f3f0';line(p.neck,p.hip,13);line(p.neck,p.head,8);g.lineWidth=7;g.beginPath();g.arc(...p.head,20,0,Math.PI*2);g.fill();g.stroke();line(p.neck,p.lh,9);line(p.lh,p.le,8);line(p.neck,p.rh,9);line(p.rh,p.re,8);line(p.hip,p.lk,12);line(p.lk,p.lf,10);line(p.hip,p.rk,12);line(p.rk,p.rf,10);g.restore()}
function opponent(v){g.save();g.translate(v.x,426+v.y);g.rotate(v.a);g.strokeStyle='#171717';g.fillStyle='#f3f3f0';line([0,-65],[0,-136],16);g.lineWidth=8;g.beginPath();g.arc(0,-161,22,0,Math.PI*2);g.fill();g.stroke();line([0,-125],[-43,-94],12);line([-43,-94],[-61,-60],10);line([0,-125],[42,-94],12);line([42,-94],[61,-60],10);line([0,-65],[-27,-32],14);line([-27,-32],[-43,0],12);line([0,-65],[27,-32],14);line([27,-32],[43,0],12);g.restore()}
function draw(ms){g.fillStyle='#f3f3f0';g.fillRect(0,0,960,540);g.strokeStyle='#181818';line([0,427],[960,427],3);g.fillStyle='#222';g.font='700 13px system-ui';g.fillText('ROUNDHOUSE / ANIMATION STUDY',25,35);let p=interp(poses,ms),v=interp(victim,ms);g.fillStyle='#d8d8d5';for(let x of [p.x,v.x]){g.beginPath();g.ellipse(x,432,48,7,0,0,Math.PI*2);g.fill()}g.strokeStyle='#222';if(ms>490&&ms<760){let power=Math.sin((ms-490)/270*Math.PI);for(let j=0;j<5;j++){g.globalAlpha=power*(.26-j*.035);g.beginPath();g.ellipse(p.x+110+j*11,426+p.y-105,85+j*9,18+j*2,-.13,0,Math.PI*2);g.stroke()}g.globalAlpha=1}figure(p);opponent(v);if(ms>630&&ms<860){let r=16+(ms-630)*.4;for(let i=0;i<12;i++){let a=i*Math.PI/6;g.strokeStyle='#171717';line([555+Math.cos(a)*r*.5,322+Math.sin(a)*r*.5],[555+Math.cos(a)*r,322+Math.sin(a)*r],2)}}for(const q of ink){g.fillStyle='#171717';g.beginPath();g.arc(q.x,q.y,q.r,0,Math.PI*2);g.fill();q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.life--}ink=ink.filter(q=>q.life>0)}
function tick(ts){if(playing){t=Math.min(2600,ts-start);if(t>650&&!impact){impact=true;for(let i=0;i<36;i++){let a=Math.random()*Math.PI*2,s=3+Math.random()*10;ink.push({x:555,y:322,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*3,life:24})}}if(t>=2600){playing=false;document.getElementById('go').textContent='REPLAY ROUNDHOUSE'}}draw(t);requestAnimationFrame(tick)}
document.getElementById('go').onclick=()=>{t=0;start=performance.now();playing=true;impact=false;ink=[]};requestAnimationFrame(tick);
</script></body></html>
